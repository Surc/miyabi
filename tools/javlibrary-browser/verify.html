<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavLibrary 评分连接</title>
<style>
body{font:16px/1.65 system-ui,sans-serif;max-width:640px;margin:72px auto;padding:0 24px;color:#1c1c1c;background:#fafafa}main{background:white;padding:32px;border:1px solid #ddd;border-radius:20px}h1{font-size:25px;margin:0 0 12px}p{color:#555}button{font:inherit;border:1px solid #ccc;border-radius:9px;background:white;padding:10px 16px;cursor:pointer;margin:6px 8px 6px 0}button:first-child{background:#151515;color:white;border-color:#151515}button:disabled{opacity:.5;cursor:wait}#status{font-weight:600;color:#151515}#message{min-height:2em;color:#a13220}
</style>
<main>
<h1>JavLibrary 评分连接</h1>
<p>在专用 Edge 看到 JavLibrary 的影片列表或详情后，回到这页点击“验证完成”。等页面提示“验证已确认”后即可关闭 Edge。</p>
<p id="status" role="status">正在读取连接状态…</p>
<div><button id="open">打开验证浏览器</button><button id="confirm">验证完成</button></div>
<p id="message" role="alert"></p>
<p>取分时，运行中的验证服务会用同一浏览器资料最小化重开 Edge。网站再次要求验证时，请打开专用浏览器并完成验证。</p>
</main>
<script>
const status=document.querySelector('#status');
const message=document.querySelector('#message');
const buttons=document.querySelectorAll('button');
const labels={closed:'尚未打开浏览器',verification_required:'等待你完成验证',ready:'验证已确认，可以读取评分',standby:'验证已确认，取分时会打开浏览器',loading:'正在获取页面，请稍候'};
const messages={verification_required:'请在专用 Edge 打开影片页，再点击“验证完成”。',browser_unavailable:'无法连接专用浏览器，请关闭旧的专用验证窗口后重新打开。',debug_port_in_use:'专用浏览器调试端口已被占用，请关闭旧的专用验证窗口后重试。',busy:'正在获取页面，请稍后再试。'};
let revision=0;
let working=false;
function show(state) {
  const label=labels[state.state]||'连接不可用';
  status.textContent=state.miyabi_connected===false?label+'，正在连接 Miyabi':label;
}
async function update() {
  if (working) return;
  const expected=revision;
  try {
    const reply=await fetch('/control/status');
    const state=await reply.json();
    if (revision===expected) show(state);
  } catch {
    if (revision===expected) status.textContent='连接服务未运行';
  }
}
for (const name of ['open','confirm']) {
  document.querySelector('#'+name).onclick=async()=>{
    working=true;
    revision++;
    buttons.forEach(button=>button.disabled=true);
    status.textContent=name==='confirm'?'正在确认验证':'正在打开专用浏览器';
    message.textContent='';
    try {
      const reply=await fetch('/control/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      const state=await reply.json();
      if (reply.ok) show(state);
      else message.textContent=messages[state.error]||'操作失败，请重试。';
    } catch {
      message.textContent='连接服务未运行。';
    } finally {
      working=false;
      buttons.forEach(button=>button.disabled=false);
      await update();
    }
  };
}
update();
setInterval(update,1500);
</script>
</html>
