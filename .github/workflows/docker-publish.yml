name: Publish Miyabi image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (master only)'
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/master ]]; then
            echo '::error::Manual releases must use master' >&2
            exit 1
          fi
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$version' (expected e.g. 1.2.3)" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: version
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: ${{ github.event_name == 'workflow_dispatch' && '-vv --unreleased' || '-vv --current' }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

  create-draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, changelog]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Draft Release
        shell: bash
        run: |
          tag="v${VERSION}"

          if state=$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$state" == true ]]; then
              echo "Keeping existing draft $tag."
              exit 0
            fi
            echo "::error::Refusing to overwrite published release $tag" >&2
            exit 1
          fi

          printf '%s\n' "$RELEASE_BODY" > "$RUNNER_TEMP/release-notes.md"
          if [[ -f "docs/releases/${tag}.md" ]]; then
            cp "docs/releases/${tag}.md" "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$GITHUB_SHA" \
            --title "Release $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}

  # 仅用于按架构预热 buildx/GHA 缓存，不推送任何镜像，
  # 因此不会在 registry 里留下 build-<run_id>-<arch> 这类中间 tag。
  build:
    name: Warm cache (${{ matrix.suffix }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Warm cache [${{ matrix.platform }}]
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=miyabi-${{ matrix.suffix }}
          cache-to: type=gha,scope=miyabi-${{ matrix.suffix }},mode=max
          provenance: false
          sbom: false

  # J4125 使用 linux/amd64，复用上面预热好的缓存，
  # registry 中只会出现最终的正式 tag。
  publish:
    name: Build and push amd64 image
    needs: [version, build, create-draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lowercase; derive the namespace so forks publish to
      # their own registry while the upstream repository keeps the same address.
      - name: Resolve image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push (amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=miyabi-amd64
          provenance: false
          sbom: false

      - name: Build and push MDCz bridge (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/mdcz-bridge/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-mdcz:v${{ needs.version.outputs.version }}
            ${{ env.IMAGE_NAME }}-mdcz:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=miyabi-mdcz-amd64
          cache-to: type=gha,scope=miyabi-mdcz-amd64,mode=max
          provenance: false
          sbom: false

  native-package:
    name: Build native amd64 FPK preview
    needs: [version, create-draft-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build and smoke-test native package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/fnos/build-release.sh "$VERSION" "$RUNNER_TEMP/native-release"
      - name: Attach native preview and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v${VERSION}" "$RUNNER_TEMP/native-release/"* --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: [version, create-draft-release, publish, native-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
