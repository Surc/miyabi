# This requires a Miyabi test image built from this PR, not released v0.3.0.
services:
  miyabi:
    image: ${MIYABI_IMAGE:?Set a validated image built from this PR}
    platform: linux/amd64
    ports: ["8080:8080"]
    environment:
      MIYABI_ACCESS_PASSWORD: ${MIYABI_ACCESS_PASSWORD:?Set the access password}
      MIYABI_PUBLIC_URL: ${MIYABI_PUBLIC_URL:?Set Miyabi URL reachable by Emby}
    volumes:
      - miyabi-data:/app/data
    restart: unless-stopped
  mdcz-bridge:
    build:
      context: ../..
      dockerfile: extensions/mdcz-bridge/Dockerfile
    image: miyabi-mdcz-bridge:f65e7d4-v1
    platform: linux/amd64
    environment:
      MIYABI_MDCZ_KEY: ${MDCZ_BRIDGE_KEY:?Set a random key of at least 24 characters}
    volumes:
      - mdcz-data:/data
      - ./mdcz.example.json:/config/mdcz.json:ro
    expose: ["3840"]
    restart: unless-stopped
volumes:
  miyabi-data:
  mdcz-data:
